name: Validate feed data

on:
  push:
    branches: [main]
    paths:
      - "data.json"
      - "extra-updates.json"
      - "app.js"
      - "scripts/**"
      - ".github/workflows/validate.yml"
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-data.mjs
